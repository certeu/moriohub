- moriodata:
    info: "Collects metrics from MinIO containers on Linux systems"
    vars:
      METRICS_LINUX_MINIO_DOCKER_JOURNALD_SECRET:
        dflt: false
        info: "The token to authenticate to MinIO. You can generate one by running `mc admin prometheus generate loca --api-version v3` inside the container (using 'local' as alias in this example, update as needed)"
      METRICS_LINUX_MINIO_DOCKER_JOURNALD_HOST:
        dflt: localhost
        info: The host from which to scrape the v3 MinIO Prometheus metrics
      METRICS_LINUX_MINIO_DOCKER_JOURNALD_PORT:
        dflt: 9000
        info: The port from which to scrape the v3 MinIO Prometheus metrics

- module: prometheus
  period: "{| MORIO_TICK |}"
  metricsets:
    - collector
  hosts:
    - "{|METRICS_LINUX_MINIO_DOCKER_JOURNALD_HOST|}:{|METRICS_LINUX_MINIO_DOCKER_JOURNALD_PORT|}"
  metrics_path: /minio/metrics/v3
{|#METRICS_LINUX_MINIO_DOCKER_JOURNALD_SECRET|}
  bearer_token_file: "{| MORIO_CONFIG_DIR |}/vars.d/METRICS_LINUX_MINIO_DOCKER_JOURNALD_SECRET"
{|/METRICS_LINUX_MINIO_DOCKER_JOURNALD_SECRET|}
  processors:
    # Set dataset
    - add_labels:
        labels:
          morio.dataset: prometheus
