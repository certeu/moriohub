- moriodata:
    info: "Collects metrics from CoreDNS on Linux systems"
    vars:
      METRICS_LINUX_COREDNS_PORT:
        dflt: 9153
        info: The port on which the prometheus metrics are exposed
      METRICS_LINUX_COREDNS_HOST:
        dflt: "localhost"
        info: The host on which the prometheus metrics are exposed
      METRICS_LINUX_COREDNS_INCLUDE:
        dflt:
          - ^coredns_dns_requests_total$
          - ^coredns_dns_responses_total$
          - ^process_network_receive_bytes_total$
          - ^process_network_transmit_bytes_total$
          - ^process_resident_memory_bytes$
          - ^process_virtual_memory_bytes$
        info: The list of metrics to include

#
# Note: To enable metrics in CodeDNS, you need to enable the
# Prometheus plugin: https://coredns.io/plugins/metrics/
# Since this is an in-tree plugin, you do only need to add it
# to your Corefile for all zones where you want metrics.
#

- module: prometheus
  metricsets:
    - collector
  period: "{| MORIO_TICK |}"
  hosts:
    - "{|{ METRICS_LINUX_COREDNS_HOST }|}:{| METRICS_LINUX_COREDNS_PORT |}"
  metrics_path: /metrics
  metrics_filters:
    include: {|{ METRICS_LINUX_COREDNS_INCLUDE }|}
