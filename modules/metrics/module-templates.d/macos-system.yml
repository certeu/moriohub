- moriodata:
    info: "Collects metrics from MacOS systems"
    vars:
      METRICS_MACOS_SYSTEM_INTERVAL_FILESYSTEM:
        dflt: 10m
        info: The interval to use for collecting filesystem data
      METRICS_MACOS_SYSTEM_METRICSETS_ALWAYS:
        dflt:
          - cpu
          - diskio
          - load
          - memory
          - process_summary
          - socket_summary
        info: The metricsets to collect on every tick
      METRICS_MACOS_SYSTEM_MOUNTPOINTS_IGNORE_REGEX:
        dflt: '^/(snap|sys|cgroup|proc|dev|host|lib)($|/)'
        info: A regular expression of mountpoints for which to drop filesystem events

- module: system
  period: "{| MORIO_TICK |}"
  metricsets: {|{ METRICS_MACOS_SYSTEM_METRICSETS_ALWAYS }|}
  service:
    state_filter: [ failed ]

- module: system
  period: {| METRICS_MACOS_SYSTEM_INTERVAL_FILESYSTEM |}
  metricsets:
    - filesystem
  processors:
    - drop_event:
        when:
          regexp:
            system.filesystem.mount_point: {|{ METRICS_MACOS_SYSTEM_MOUNTPOINTS_IGNORE_REGEX }|}
