- moriodata:
    info: "Collects metrics from Traefik on Linux systems"
    vars:
      METRICS_LINUX_TRAEFIK_PORT:
        dflt: 8080
        info: The port on which the prometheus metrics are exposed
      METRICS_LINUX_TRAEFIK_HOST:
        dflt: "localhost"
        info: The host on which the prometheus metrics are exposed
      METRICS_LINUX_TRAEFIK_INCLUDE:
        dflt:
          - ^process_network_receive_bytes_total$
          - ^process_network_transmit_bytes_total$
          - ^process_resident_memory_bytes$
          - ^process_virtual_memory_bytes$
          - ^traefik_open_connections*
          - ^traefik_service_requests_total*
          - ^traefik_service_requests_tls_total*
        info: The list of metrics to include

#
# Note: This assume Prometheus metrics are enabled in Traefik.
# Add the following to your static Traefik config:
#
# metrics:
#  prometheus:
#    buckets:
#      - 0.1
#      - 0.3
#      - 1.2
#      - 5.0
#

- module: prometheus
  metricsets:
    - collector
  period: "{| MORIO_TICK |}"
  hosts:
    - "{|{ METRICS_LINUX_TRAEFIK_HOST }|}:{| METRICS_LINUX_TRAEFIK_PORT |}"
  metrics_path: /metrics
  metrics_filters:
    include: {|{ METRICS_LINUX_COREDNS_INCLUDE }|}
