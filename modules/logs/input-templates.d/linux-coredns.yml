- moriodata:
    info: "Collects log data from CoreDNS on Linux systems"
    vars:
      LOGS_LINUX_COREDNS_LOG_PATHS:
        dflt:
          - /var/log/docker/containers/coredns.log
        info: A list of (glob) paths from which to collect CoreDNS logs

- type: filestream
  id: coredns_log
  paths: {|{ LOGS_LINUX_COREDNS_LOG_PATHS }|}
  processors:
    - add_labels:
        labels:
          morio.dataset: coredns-log
