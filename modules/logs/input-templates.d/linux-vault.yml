- moriodata:
    info: "Collects log data from Hashicorp Vault on Linux systems"
    vars:
      LOGS_LINUX_VAULT_AUDIT_LOG_PATHS:
        dflt:
          - /var/log/vault/vault_audit.log
        info: A list of (glob) paths from which to collect Hashicorp Vault audit logs
      LOGS_LINUX_VAULT_LOG_PATHS:
        dflt:
          - /var/log/vault/vault.log
        info: A list of (glob) paths from which to collect Hashicorp Vault logs

- type: filestream
  id: hashicorp_vault_audit_log
  paths: {|{ LOGS_LINUX_VAULT_AUDIT_LOG_PATHS }|}
  processors:
    # Set dataset
    - add_labels:
        labels:
          morio.dataset: vault-audit-log
    # Parse log message as JSON
    - decode_json_fields:
        fields: ["message"]
        process_array: false
        max_depth: 4
        target: "hashicorp.vault.audit_log"
        overwrite_keys: false
        add_error_key: false
    # Copy fields for ECS compliance
    - copy_fields:
        fields:
          - from: hashicorp.vault.audit_log.time
            to: "@timestamp"
          - from: hashicorp.vault.audit_log.request.remote_address
            to: client.ip
          - from: hashicorp.vault.audit_log.request.remote_port
            to: client.port
        fail_on_error: false
        ignore_missing: true

- type: filestream
  id: hashicorp_vault_log
  paths: {|{ LOGS_LINUX_VAULT_LOG_PATHS }|}
  processors:
    # Set dataset
    - add_labels:
        labels:
          morio.dataset: vault-log
    - decode_json_fields:
        fields: ["message"]
        process_array: false
        max_depth: 3
        target: "hashicorp.vault.log"
        overwrite_keys: false
        add_error_key: false
    # Copy fields for ECS compliance
    - copy_fields:
        fields:
          - from: "hashicorp.vault.log.@timestamp"
            to: "@timestamp"
        fail_on_error: false
        ignore_missing: true
