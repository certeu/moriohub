- moriodata:
    info: "Collects log data from Laurel on Linux systems"
    vars:
      LOGS_LINUX_LAUREL_LOG_PATHS:
        dflt:
          - /var/log/laurel/audit.log.*
        info: A (glob) list of paths from which to collect Laurel logs

- type: filestream
  id: laurel_everything
  paths: {|{ LOGS_LINUX_LAUREL_LOG_PATHS }|}
  processors:
    - decode_json_fields:
        fields: ["message"]
        process_array: false
        max_depth: 2
        target: ""
        overwrite_keys: false
        add_error_key: true
    - dissect:
        field: "ID"
        tokenizer: "%{event.created}:%{event.id}" # We cannot convert Epoch-formatted time here, so we only isolate it
        target_prefix: ''
        ignore_missing: true
        ignore_failure: true
        overwrite_keys: true
