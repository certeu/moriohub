# This Morio module assumes that:
#
#   - MinIO runs inside a container
#   - The container is configured to use the `journald` log driver
#
# If one or more of these assumptions don't hold true for your use case,
# you can use this as a starting point, but should not use it as-is.

- moriodata:
    info: "Collects log data from MinIO on Linux systems"
    vars:
      LOGS_LINUX_MINIO_DOCKER_JOURNALD_SYSTEMD_SERVICE:
        dflt: ""
        info: |
          Set this variable if the MinIO container is running as a systemd service.
          In this case, we will collect the container logs AND the systemd service logs.
          Clear this variable if the MinIO container is not running as a systemd service.
          In this case, we will only collect the container logs.
      LOGS_LINUX_MINIO_DOCKER_JOURNALD_NAME:
        dflt: minio
        info: The name of the container or systemd service under which MinIO is running

{|#LOGS_LINUX_MINIO_DOCKER_JOURNALD_SYSTEMD_SERVICE|}
- type: journald
  id: journald_minio
  include_matches:
    match:
      - "_SYSTEMD_UNIT={| LOGS_LINUX_MINIO_DOCKER_JOURNALD_NAME |}"
  processors:
    # All journald logs are collected by the linux-system module
    # Here, we only care about the MinIO logs, so we dump some baggage
    - drop_fields:
        fields:
          - input
          - journald
          - log
          - process
          - systemd
          - user
        ignore_missing: true
{|/LOGS_LINUX_MINIO_DOCKER_JOURNALD_SYSTEMD_SERVICE|}
{|^LOGS_LINUX_MINIO_DOCKER_JOURNALD_SYSTEMD_SERVICE|}
- type: journald
  id: journald_minio
  units:
    - docker
  include_matches:
    match:
      - "container.name={| LOGS_LINUX_MINIO_DOCKER_JOURNALD_NAME |}"
  processors:
{|/LOGS_LINUX_MINIO_DOCKER_JOURNALD_SYSTEMD_SERVICE|}

    # Set dataset
    - add_labels:
        labels:
          morio.dataset: minio
