# This Morio module assumes that:
#
#   - CoreDNS runs inside a container
#   - The container is configured to use the `journald` log driver
#   - CoreDNS uses the `common` log format
#
# If one or more of these assumptions don't hold true for your use case,
# you can use this as a starting point, but should not use it as-is.

- moriodata:
    info: "Collects log data from CoreDNS on Linux systems"
    vars:
      LOGS_LINUX_COREDNS_DOCKER_JOURNALD_CONTAINER_NAME:
        dflt: coredns
        info: The name of hte CoreDNS container to collect logs from

- type: journald
  id: journald_coredns
  units:
    - docker

  # Adapt to your container name as needed
  include_matches:
    match:
      - "container.name={| LOGS_LINUX_COREDNS_DOCKER_JOURNALD_CONTAINER_NAME |}"

  processors:

    # All journald logs are collected by the linux-system module
    # Here, we only care about the coredns logs, so we dump some baggage
    - drop_fields:
        fields:
          - input
          - journald
          - log
          - process
          - systemd
          - user
        ignore_missing: true

    # This parses the coredns common logformat, prefixed by the [LOG_LEVEL]
    # See: https://coredns.io/plugins/log/
    - dissect:
        tokenizer: "[%{loglevel}] %{remote}:%{port} - %{id} \"%{type} %{class} %{name} %{proto} %{size} %{do} %{bufsize}\" %{rcode} %{rflags} %{rsize} %{duration}"
        field: message
        target_prefix: coredns.log
        ignore_failure: true
        trim_values: all

    # Copy client ip & port to the correct fields for ECS compliance
    - copy_fields:
        fields:
          - from: coredns.log.remote
            to: client.ip
          - from: coredns.log.port
            to: client.port
        fail_on_error: false
        ignore_missing: true
