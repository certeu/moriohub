
- moriodata:
    info: "Collects log data from Splunk on Linux systems"
    href: "https://morio.it/hub/modules/logs/linux-splunk"
    vars:
      LOGS_LINUX_SPLUNK_PRIMARY_LOG_PATHS:
        dflt:
          - /opt/splunk/var/log/splunk/splunkd.log
          - /opt/splunkforwarder/var/log/splunk/splunkd.log
        info: A (glob) list of paths from which to collect Splunk primary logs
      LOGS_LINUX_SPLUNK_OTHER_LOG_PATHS:
        dflt:
          - /opt/splunk/var/log/splunk/metrics.log
          - /opt/splunkforwarder/var/log/splunk/metrics.log
          - /opt/splunk/var/log/splunk/license_usage.log
          - /opt/splunkforwarder/var/log/splunk/license_usage.log
        info: A (glob) list of paths from which to collect Splunk other logs
      LOGS_LINUX_SPLUNK_ACCESS_LOG_PATHS:
        dflt:
          - /opt/splunk/var/log/splunk/splunkd_ui_access.log
          - /opt/splunkforwarder/var/log/splunk/splunkd_ui_access.log
        info: A (glob) list of paths from which to collect Splunk UI access logs
      LOGS_LINUX_SPLUNK_SPLUNKD_ACCESS_LOG_PATHS:
        dflt:
          - /opt/splunk/var/log/splunk/splunkd_access.log
          - /opt/splunkforwarder/var/log/splunk/splunkd_access.log
        info: A (glob) list of paths from which to collect Splunkd access logs
      LOGS_LINUX_SPLUNK_CONFIGURATION_CHANGE_LOG_PATHS:
        dflt:
          - /opt/splunk/var/log/splunk/configuration_change.log
          - /opt/splunkforwarder/var/log/splunk/configuration_change.log
        info: A (glob) list of paths from which to collect Splunk configuration change logs
    version: 1

- type: filestream
  id: splunk_primary
  paths: {{{ LOGS_LINUX_SPLUNK_PRIMARY_LOG_PATHS }}}
  processors:
    - dissect:
        field: "message"
        tokenizer: "%{+temp_timestamp} %{+temp_timestamp} %{+temp_timestamp} %{log.level->} %{service.name} [%{process.thread.id} %{process.thread.name}] - %{event.message}"
        target_prefix: ''
        ignore_missing: true
        ignore_failure: true
        overwrite_keys: true
    - add_labels: 
        labels:
          log.format: "splunk_primary"
    - timestamp:
        field: temp_timestamp
        layouts:
          - '01-02-2006 15:04:05.999 -0700'
        timezone: Local
    - drop_fields:
        fields: temp_timestamp

- type: filestream
  id: splunk_other
  paths: {{{ LOGS_LINUX_SPLUNK_OTHER_LOG_PATHS }}}
  processors:
    - dissect:
        field: "message"
        tokenizer: "%{+temp_timestamp} %{+temp_timestamp} %{+temp_timestamp} %{log.level->} %{service.name} - %{event.message}"
        target_prefix: ''
        ignore_missing: true
        ignore_failure: true
        overwrite_keys: true
    - add_labels: 
        labels:
          log.format: "splunk_other"
    - timestamp:
        field: temp_timestamp
        layouts:
          - '01-02-2006 15:04:05.999 -0700'
        timezone: Local
    - drop_fields:
        fields: temp_timestamp

- type: filestream
  id: splunk_ui_access
  paths: {{{ LOGS_LINUX_SPLUNK_ACCESS_LOG_PATHS }}}
  processors:
    - dissect:
        field: "message"
        tokenizer: "%{source.ip} %{http.auth_type} %{http.username} [%{temp_timestamp}] \"%{http.request.method} %{url.full} %{http.version}\" %{http.response.status_code} %{http.response.body.bytes} \"%{http.request.referrer}\" \"%{user_agent.original}\" - %{splunk.session.id} %{splunk.duration}"
        target_prefix: ''
        ignore_missing: true
        ignore_failure: true
        overwrite_keys: true
    - add_labels: 
        labels:
          log.format: "splunk_ui_access"
    - timestamp:
        field: temp_timestamp
        layouts:
          - '01-02-2006 15:04:05.999 -0700'
        timezone: Local
    - drop_fields:
        fields: temp_timestamp

- type: filestream
  id: splunk_splunkd_access
  paths: {{{ LOGS_LINUX_SPLUNK_SPLUNKD_ACCESS_LOG_PATHS }}}
  processors:
    - if:
        regexp:
          message: ' - - - - - ' 
      then:
        - dissect:
            field: "message"
            tokenizer: "%{source.ip} %{http.auth_type} %{http.username} [%{+temp_timestamp} %{+temp_timestamp}] \"%{http.request.method} %{url.full} %{http.version}\" %{http.response.status_code} %{http.response.body.bytes} - - - - - %{splunk.duration}"
            target_prefix: ''
            ignore_missing: true
            ignore_failure: true
            overwrite_keys: true
      else:
        - if:
            regexp:
              message: '" - ' 
          then:
            - dissect:
                field: "message"
                tokenizer: "%{source.ip} %{http.auth_type} %{http.username} [%{+temp_timestamp} %{+temp_timestamp}] \"%{http.request.method} %{url.full} %{http.version}\" %{http.response.status_code} %{http.response.body.bytes} \"%{http.request.referrer}\" \"%{user_agent.original}\" - %{splunk.duration}"
                target_prefix: ''
                ignore_missing: true
                ignore_failure: true
                overwrite_keys: true
          else:
            - dissect:
                field: "message"
                tokenizer: "%{source.ip} %{http.auth_type} %{http.username} [%{+temp_timestamp} %{+temp_timestamp}] \"%{http.request.method} %{url.full} %{http.version}\" %{http.response.status_code} %{http.response.body.bytes} \"%{http.request.referrer}\" \"%{user_agent.original}\" - - - %{splunk.duration}"
                target_prefix: ''
                ignore_missing: true
                ignore_failure: true
                overwrite_keys: true
    - add_labels: 
        labels:
          log.format: "splunk_splunkd_access"
    - timestamp:
        field: temp_timestamp
        layouts:
          - '02/Jan/2006:15:04:05.999 -0700'
        timezone: Local
    - drop_fields:
        fields: temp_timestamp

- type: filestream
  id: splunk_configuration_change
  paths: {{{ LOGS_LINUX_SPLUNK_CONFIGURATION_CHANGE_LOG_PATHS }}}
  processors:
    - if:
        regexp:
          message: '"modtime":' 
      then:
        - dissect:
            field: "message"
            tokenizer: '{"datetime":"%{+temp_timestamp} %{+temp_timestamp} %{+temp_timestamp}","log_level":"%{log.level->}","component":"%{splunk.configuration_change.component}","data":{"path":"%{splunk.configuration_change.data.path}","action":"%{splunk.configuration_change.data.action}","modtime":"%{splunk.configuration_change.data.modtime}","epoch_time":"%{splunk.configuration_change.data.epoch_time}","new_checksum":"%{splunk.configuration_change.data.new_checksum}","old_checksum":"%{splunk.configuration_change.data.old_checksum}","changes":[%{splunk.configuration_change.data.changes}]}}'
            target_prefix: ''
            ignore_missing: true
            ignore_failure: true
            overwrite_keys: true
      else:
        - dissect:
            field: "message"
            tokenizer: '{"datetime":"%{+temp_timestamp} %{+temp_timestamp} %{+temp_timestamp}","log_level":"%{log.level->}","component":"%{splunk.configuration_change.component}","data":{"path":"%{splunk.configuration_change.data.path}","action":"%{splunk.configuration_change.data.action}","epoch_time":"%{splunk.configuration_change.data.epoch_time}","new_checksum":"%{splunk.configuration_change.data.new_checksum}","old_checksum":"%{splunk.configuration_change.data.old_checksum}","changes":[%{splunk.configuration_change.data.changes}]}}'
            target_prefix: ''
            ignore_missing: true
            ignore_failure: true
            overwrite_keys: true
    - add_labels:
        labels:
          log.format: "splunk_configuration_change"
    - timestamp:
        field: temp_timestamp
        layouts:
          - '01-02-2006 15:04:05.999 -0700'
        timezone: Local
    - drop_fields:
        fields: temp_timestamp

