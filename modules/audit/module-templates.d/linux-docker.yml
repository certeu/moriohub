- moriodata:
    info: "Auditd rules for Docker on Linux"
    vars:
      AUDIT_LINUX_DOCKER_RULE_FILES:
        dflt:
          - /etc/morio/audit/rules.d/linux-docker.rules
        info: A list of files with auditd rules to load

- module: auditd
  audit_rule_files: {|{ AUDIT_LINUX_DOCKER_RULE_FILES }|}
  ignore_errors: false
